[project]
name = "nomitr-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nomitr", email = "2076743613@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
nomitr-api = "nomitr_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
