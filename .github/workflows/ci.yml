name: CI

on:
  push:
    branches: [main, devloop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen：必须用仓库里的 uv.lock，锁文件过期就失败，保证可复现
      - name: Sync dependencies
        run: uv sync --frozen

      # 语法检查：不依赖任何测试，先保证代码至少能被编译
      - name: Compile check
        run: uv run python -m compileall -q src

      # 第一个测试写好后取消下面两行注释
      # - name: Test
      #   run: uv run pytest -q
