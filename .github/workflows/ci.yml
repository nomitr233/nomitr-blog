name: CI

on:
  push:
    branches: [main, devloop]
  pull_request:

jobs:
  # 前端工作区：web、admin、packages/*
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 提交 pnpm-lock.yaml 后走 frozen 模式；首个提交若还没生成锁文件则退回普通安装
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm -r --if-present build

  # 后端：Python，独立虚拟环境
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q src

      - name: Lint
        run: ruff check src

      - name: Typecheck
        run: mypy src

      # tests/ 里还没有真实用例时 pytest 会以 5 退出，补上用例后再打开
      # - name: Test
      #   run: pytest -q
